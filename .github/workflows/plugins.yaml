---
name: Generate Plugin List

on:
    push:
        branches: [main]
        paths:
            - "lua/plugins/**"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install Lua
              run: sudo apt-get update && sudo apt-get install -y lua5.4

            - name: Update plugin list in README
              run: lua5.4 .github/scripts/generate-plugin-list.lua

            - name: Commit changes
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add README.md
                # Only commit if there are actual changes
                git diff --cached --quiet || git commit -m "docs: update plugin list [skip ci]"
                gh auth setup-git
                git push
